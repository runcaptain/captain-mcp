name: deploy-mcp

# Deploy the hosted Captain MCP server to Porter on push to main.
# Porter builds the Docker image itself (build.context/build.dockerfile stored
# on the app), so this workflow only stamps a tag and runs `porter apply`.
#
# ONE-TIME SETUP (dashboard/admin, cannot be scripted here):
#   1. Create a Porter app "captain-mcp" (project 17299, cluster 5167 or the
#      cluster you choose) pointed at this repo, build method docker, Dockerfile
#      ./Dockerfile — or `porter apply` this repo's porter.yaml once manually.
#   2. Attach the domain mcp.runcaptain.com (DNS CNAME to the Porter ingress).
#   3. Fill in PORTER_DEPLOYMENT_TARGET_ID below and add the app's deploy token
#      as the repo secret PORTER_APP_TOKEN.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  porter-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0

      - name: Deploy to Porter
        run: porter apply
        env:
          PORTER_APP_NAME: captain-mcp
          PORTER_CLUSTER: "5167"
          # TODO(setup): fill with the app's deployment target id from the Porter dashboard.
          PORTER_DEPLOYMENT_TARGET_ID: ""
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: "17299"
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          # TODO(setup): add this repo secret with the captain-mcp app's deploy token.
          PORTER_TOKEN: ${{ secrets.PORTER_APP_TOKEN }}
