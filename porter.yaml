version: v2
name: captain-mcp

build:
  context: ./
  method: docker
  dockerfile: ./Dockerfile

services:
  - name: mcp
    type: web
    run: node dist/httpServer.js
    port: 8080
    cpuCores: 0.25
    ramMegabytes: 512
    autoscaling:
      enabled: true
      minInstances: 2
      maxInstances: 6
      cpuThresholdPercent: 70
    healthCheck:
      enabled: true
      httpPath: /health
    domains:
      - name: mcp.runcaptain.com
    # Stateless Bearer-passthrough: no app-level Captain credentials. Callers
    # supply their own key per request via the Authorization header.
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "8080"
      - name: CAPTAIN_MCP_ALLOW_LOCAL_FILES
        value: "false"
      # ---- MCP OAuth (resource-server mode) ------------------------------
      # All PUBLIC config, no secrets — the no-secrets property of this file
      # is deliberate and load-bearing. Flip CAPTAIN_OAUTH_ENABLED to "true"
      # to release OAuth once the API-side endpoints are live in prod.
      - name: CAPTAIN_OAUTH_ENABLED
        value: "true"
      - name: CAPTAIN_OAUTH_ISSUER
        value: "https://api.captain.dev"
      # Discovery is served by the API; the tokens themselves are minted by
      # Auth0 (Captain's tenant), so verification pins Auth0's issuer + keys.
      - name: CAPTAIN_OAUTH_TOKEN_ISSUER
        value: "https://auth.captain.dev/"
      - name: CAPTAIN_JWKS_URL
        value: "https://auth.captain.dev/.well-known/jwks.json"
      - name: CAPTAIN_MCP_PUBLIC_URL
        value: "https://mcp.runcaptain.com/mcp"
